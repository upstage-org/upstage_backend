[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upstage-backend"
version = "0.0.0"
description = "UpStage backend (FastAPI + Ariadne GraphQL + SQLAlchemy + aiomqtt)."
requires-python = ">=3.12"
# Single source of truth (requirements.txt is just `-e .`). Runtime deps are
# largely unpinned; the exact versions live in uv.lock, which both the
# containers and CI install from (`uv sync --frozen`). Upgrade with
# `uv lock --upgrade`. Upper bounds are added only where a new major changes
# defaults we rely on. pytest/faker/coverage/ruff stay in the runtime list on
# purpose: the container image is built with `uv sync --no-dev`, and the
# src-tree integration suites are run inside that image.
dependencies = [
    "aiomqtt",
    "aiosmtplib",
    "alembic",
    "argon2-cffi",
    "ariadne",
    "arrow",
    "asyncpg",
    "coverage",
    "cryptography",
    "email-validator",
    # Imported directly (custom scalars / OperationType); previously only a
    # transitive dependency of ariadne. Capped: graphql-core 3.3.0 removed
    # `ExecutionContext` from the package root, which ariadne 1.1.0 (the
    # latest) imports - `import ariadne` fails. Lift when ariadne supports 3.3.
    "graphql-core>=3.2,<3.3",
    "faker",
    # `!= 0.136.3` works around MAL-2026-4750 (malicious release that
    # injected an undocumented `fastar` typosquat into the [standard]
    # extras group on 2026-05-23). Drop the constraint when upstream
    # ships a clean 0.136.x or higher version.
    "fastapi != 0.136.3",
    "fastapi_exception",
    "fastapi_global_variable",
    "loguru",
    "paho-mqtt",
    "Pillow",
    # Imported directly (validation models); previously transitive via fastapi.
    "pydantic",
    "pydantic-settings",
    "psycopg2-binary",
    "pyjwt",
    "pyotp",
    "pytest",
    # Captcha verification (users/services/user.py).
    "requests",
    "python-dotenv",
    "ruff",
    # SQLAlchemy 2.1 makes psycopg (v3) the default Postgres driver; env.py
    # names psycopg2 explicitly on every URL (with_psycopg2_driver). 2.1 also
    # stopped installing greenlet by default; the [asyncio] extra brings it
    # back for event_archive's async engine.
    "sqlalchemy[asyncio]>=2.1",
    # Imported directly (Request/Response types); previously transitive via fastapi.
    "starlette",
    "stripe",
    "terminal_colors",
    "uvicorn",
    "PyMuPDF",
    "reportlab",
]

# Optional install group for developer-only tooling. Keeps the runtime
# `dependencies` list above lean (these aren't needed in the prod
# container image). Install with `pip install -e .[dev]`.
[project.optional-dependencies]
dev = [
    "pre-commit",
    "pip-audit",
]

# `pip install -e .` makes `upstage_backend` importable from anywhere; no
# PYTHONPATH manipulation, no sys.path headers, no `from src.X` imports.
[tool.setuptools.packages.find]
where = ["src"]
include = ["upstage_backend*"]

# ============================================================================
# Linter / formatter (ruff)
# ============================================================================
# Correctness rules only; style is the formatter's job.
#   * E, F    - pycodestyle errors, pyflakes (undefined names, unused imports)
#   * B       - bugbear (mutable defaults, `raise` without `from`, ...)
#   * DTZ     - naive datetimes: every timestamp column is timestamptz, use
#               global_config.helpers.clock.utcnow()
#   * RUF006  - asyncio tasks nobody keeps a reference to (use helpers.background.spawn)
#   * ASYNC   - blocking calls inside async functions (they stall the event loop)
#
# UP, SIM, I, RUF (~330 findings, all stylistic) are not enabled. We
# deliberately do NOT run `ruff format --check` against the whole repo in
# `verify.sh`: files are formatted as they are touched (the `ruff-format`
# pre-commit hook), not in one reformat-everything change.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migration_scripts",
    "build",
    "dist",
    ".venv",
    # `{REPLACE_*}` template that is sed-substituted by
    # `initial_scripts/environments/generate_environments_script.sh`;
    # not meant to pass lint until the placeholders are filled in.
    "initial_scripts/environments/env_app_template.py",
]

[tool.ruff.lint]
select = ["E", "F", "B", "DTZ", "RUF006", "ASYNC"]
ignore = [
    "E501",  # long lines — formatter handles new code; many legacy lines remain
]

[tool.ruff.lint.per-file-ignores]
# Tests stat files and block on purpose (the event-loop tests measure exactly that).
"**/tests/**" = ["ASYNC240", "ASYNC251"]
# Applied revision: its seed rows keep the timestamp they were written with.
"alembic/versions/baseline001_consolidated_schema_and_seeds.py" = ["DTZ005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Vulnerability scanner (pip-audit)
# ============================================================================
# Empty allowlist on day one. Add advisories here ONLY when:
#   * there is no patched version available upstream, AND
#   * the team has explicitly accepted the risk.
# Each entry must carry a one-line trailing comment naming the reviewer
# and the date of acceptance (e.g. # accepted 2026-05-27 by alice).
[tool.pip-audit]
ignore-vulns = []
