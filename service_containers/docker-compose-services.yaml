name: upstage-services-${SITE}
services:
  postgres:
    image: postgres:latest
    container_name: postgres_container_${SITE}
    user: "999:999"
    volumes:
      # :z relabels bind mounts for SELinux (Fedora/RHEL); ignored elsewhere
      - ${PG_DATA_DIR}/var:/var/lib/postgresql:z
      - ${PG_DATA_DIR}/data:/data/postgres:z
    #ports:
    #  - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: upstage
      PGDATA: /data/postgres
    networks:
      - upstage-network
    command: postgres -c listen_addresses='*'

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_container_${SITE}
    user: "1883:1883"
    ports:
      #- "2096:1883" docker containers use the internal port when on the same machine and network.
      - "127.0.0.1:${MOSQUITTO_EXPOSED_WS_PORT}:9001"
    volumes:
      - ${MQ_DATA_DIR}/etc/mosquitto:/etc/mosquitto:z
      - ${MQ_DATA_DIR}/var/lib/mosquitto:/var/lib/mosquitto:z
    networks:
      - upstage-network
    command:
      # Resync the password in the pw.txt file referenced below:
      /bin/sh -c "cp /etc/mosquitto/pw.backup /etc/mosquitto/pw.txt &&
      chmod 0700 /etc/mosquitto/pw.txt &&
      mosquitto_passwd -U /etc/mosquitto/pw.txt &&
      chown mosquitto:mosquitto /etc/mosquitto/pw.txt &&
      chown mosquitto:mosquitto /var/lib/mosquitto &&
      mosquitto -c /etc/mosquitto/mosquitto.conf"
    restart: no

  db_backup:
    # Same image as the server, so pg_dump always matches the server version.
    image: postgres:latest
    container_name: backup_container_${SITE}
    # Only started when COMPOSE_PROFILES=backup, which the prod run script sets.
    profiles: ["backup"]
    user: "999:999"
    depends_on:
      - postgres
    environment:
      SITE: ${SITE}
      TZ: ${BACKUP_TZ:-UTC}
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: upstage
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-3}
    volumes:
      # Defaults keep this file valid for the dev script, which does not enable
      # the backup profile and so never creates this container.
      - ${BACKUP_DIR:-/mnt/backups}:/backups:z
      # Uploaded assets: read-only at the source, copied into ASSETS_BACKUP_DIR.
      - ${ASSETS_SRC:-/app_code_prod/uploads}:/assets_src:ro
      - ${ASSETS_BACKUP_DIR:-/mnt/assets}:/assets_backup:z
      - ./backup_db.sh:/backup_db.sh:ro
    networks:
      - upstage-network
    entrypoint: ["/bin/sh", "/backup_db.sh"]
    restart: unless-stopped

networks:
  upstage-network:
    name: upstage-network-${SITE}
    driver: bridge
    external: true
volumes:
  postgresql_files:
  mosquitto_files:
