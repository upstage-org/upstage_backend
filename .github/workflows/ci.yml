name: CI

# Mirrors the local `pre-push` gate (`scripts/verify.sh`) so a
# `git push --no-verify` bypass is still caught server-side. Two jobs:
#
#   * verify  — fast, no docker. Same gate as pre-push.
#   * tests   — slower; spins up Postgres + Mosquitto and runs the
#               full pytest suite (the bits the developer machine
#               cannot run without docker).
#
# If a step is added to `scripts/verify.sh`, add it here too — local
# and server-side gates must stay in lockstep.
on:
  push:
  pull_request:

# Avoid wasting CI minutes when a branch is force-pushed mid-run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ruff + tests/unit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Same interpreter as the production container image
          # (app_containers/docker-compose.yaml); bump both together.
          # `requires-python` in pyproject.toml stays a lower bound.
          python-version: "3.14"

      # setup-uv publishes no moving major tag; bump the full version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Exactly the versions in uv.lock (the same file the container image
      # is built from). `--frozen` never re-resolves, so a new upstream
      # release cannot break CI; versions move only via `uv lock --upgrade`.
      - name: Install dependencies (from uv.lock)
        run: |
          uv sync --frozen --extra dev --python "$(which python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run verify suite
        run: ./scripts/verify.sh

  tests:
    name: full pytest (services)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `services:` containers run on the GitHub-hosted runner network;
    # the FastAPI app inside the test process reaches them on
    # localhost via the mapped ports. Versions track the dev compose
    # files in `service_containers/docker-compose-services.yaml`. Postgres
    # must not be older than the server the baseline schema was dumped from
    # (alembic/versions/baseline001_schema.sql, PostgreSQL 18): the dump sets
    # `transaction_timeout`, which PostgreSQL 16 rejects.
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upstage
        ports:
          - 5432:5432
        # Wait for Postgres to be ready before the test step starts —
        # otherwise the autouse `db_engine` fixture races the boot.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883

    env:
      # Pointed at the `services:` Postgres above; matches what the
      # autouse `db_engine` fixture in `/conftest.py` imports. env.py names
      # the psycopg2 driver on driver-less URLs (SQLAlchemy 2.1 would pick
      # psycopg v3 otherwise) and event_archive derives its asyncpg URL
      # from either form.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/upstage
      DATABASE_NAME: upstage
      # The src-tree suites refuse to run against a DB unless told it is
      # disposable (conftest.py::_guard_against_real_db).
      UPSTAGE_TESTS_ALLOW_REAL_DB: "1"
      SECRET_KEY: ci-secret
      ENV_TYPE: Test
      MQTT_BROKER: localhost
      MQTT_ADMIN_USER: ci
      MQTT_ADMIN_PASSWORD: ci
      MQTT_ADMIN_PORT: "1883"
      MQTT_TRANSPORT: tcp
      PERFORMANCE_TOPIC_RULE: "+/+/+"
      STRICT_DB_CONTEXT: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv publishes no moving major tag; bump the full version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Exactly the versions in uv.lock (the same file the container image
      # is built from). `--frozen` never re-resolves, so a new upstream
      # release cannot break CI; versions move only via `uv lock --upgrade`.
      - name: Install dependencies (from uv.lock)
        run: |
          uv sync --frozen --extra dev --python "$(which python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply database migrations
        run: alembic -c alembic.ini upgrade head

      - name: Run full pytest
        run: pytest
